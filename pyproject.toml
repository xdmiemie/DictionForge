[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dictionforge"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi==0.139.2", "uvicorn==0.50.1", "pydantic==2.10.6", "psutil==7.2.2", "numpy==2.2.6", "soundfile==0.13.1"]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]
